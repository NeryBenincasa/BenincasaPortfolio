<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0808"/>

  <!-- Radial glow center-left -->
  <radialGradient id="glow" cx="38%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#7D1D3F" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#0A0808" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top border line -->
  <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7D1D3F" stop-opacity="0"/>
    <stop offset="40%" stop-color="#7D1D3F" stop-opacity="0.6"/>
    <stop offset="70%" stop-color="#C4956A" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#C4956A" stop-opacity="0"/>
  </linearGradient>
  <rect x="0" y="0" width="1200" height="1" fill="url(#topLine)"/>

  <!-- Left vertical accent -->
  <linearGradient id="leftLine" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7D1D3F" stop-opacity="0"/>
    <stop offset="30%" stop-color="#7D1D3F" stop-opacity="0.6"/>
    <stop offset="70%" stop-color="#C4956A" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#C4956A" stop-opacity="0"/>
  </linearGradient>
  <rect x="72" y="0" width="1" height="630" fill="url(#leftLine)"/>

  <!-- Bottom border -->
  <linearGradient id="bottomLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7D1D3F" stop-opacity="0"/>
    <stop offset="50%" stop-color="#7D1D3F" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#7D1D3F" stop-opacity="0"/>
  </linearGradient>
  <rect x="0" y="629" width="1200" height="1" fill="url(#bottomLine)"/>

  <!-- Eyebrow pill -->
  <rect x="100" y="120" width="220" height="32" rx="16" fill="none" stroke="#C4956A" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="122" cy="136" r="4" fill="#C4956A"/>
  <text x="136" y="141" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#C4956A" letter-spacing="2.5" text-transform="uppercase">DESARROLLO WEB · AI-FIRST</text>

  <!-- Main headline line 1 -->
  <text x="100" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="400" fill="#F2EDE6" letter-spacing="-2">Tu negocio merece</text>

  <!-- Main headline line 2 — italic bordeaux -->
  <text x="100" y="326" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="400" fill="#7D1D3F" font-style="italic" letter-spacing="-2">una buena casa en internet.</text>

  <!-- Subline -->
  <text x="100" y="414" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="300" fill="#C8C0B5" letter-spacing="0">Sitios que convierten. MVP en 48hs. Diseño con carácter.</text>

  <!-- Divider line -->
  <rect x="100" y="454" width="560" height="1" fill="#7D1D3F" fill-opacity="0.3"/>

  <!-- Stats row -->
  <text x="100" y="498" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#F2EDE6">48hs</text>
  <text x="100" y="522" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#7A7068" letter-spacing="2">MVP ENTREGADO</text>

  <rect x="222" y="480" width="1" height="50" fill="#7D1D3F" fill-opacity="0.4"/>

  <text x="242" y="498" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#F2EDE6">95+</text>
  <text x="242" y="522" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#7A7068" letter-spacing="2">PAGESPEED SCORE</text>

  <rect x="364" y="480" width="1" height="50" fill="#7D1D3F" fill-opacity="0.4"/>

  <text x="384" y="498" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#F2EDE6">100%</text>
  <text x="384" y="522" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#7A7068" letter-spacing="2">DISEÑO A MEDIDA</text>

  <!-- Right side: B monogram -->
  <rect x="940" y="200" width="160" height="230" rx="8" fill="#120E0E" stroke="#7D1D3F" stroke-opacity="0.3" stroke-width="1"/>
  <text x="1020" y="358" font-family="Georgia, 'Times New Roman', serif" font-size="130" font-weight="400" fill="#F2EDE6" text-anchor="middle" opacity="0.95">B</text>
  <rect x="944" y="404" width="152" height="2" rx="1" fill="#7D1D3F" fill-opacity="0.6"/>
  <text x="1020" y="424" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#C4956A" text-anchor="middle" letter-spacing="3">BENINCASA</text>

  <!-- Copper accent dot bottom right -->
  <circle cx="1140" cy="570" r="18" fill="#C4956A" fill-opacity="0.15"/>
  <circle cx="1140" cy="570" r="8" fill="#C4956A" fill-opacity="0.4"/>
</svg>
